<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@500&display=swap");
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; width: 100%; height: 100%; overflow: hidden; }
  .card {
    width: 1200px; height: 630px;
    background: #000;
    position: relative;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 88px;
    font-family: Inter, sans-serif;
  }
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(60% 55% at 50% 0%, rgba(94,106,210,.28) 0%, rgba(94,106,210,0) 70%);
  }
  .inner { position: relative; }
  .eyebrow {
    font-family: "JetBrains Mono", monospace;
    font-size: 20px; font-weight: 500;
    text-transform: uppercase; letter-spacing: .25em;
    color: #828fff; margin-bottom: 28px;
  }
  h1 {
    font-size: 82px; font-weight: 800; letter-spacing: -.02em;
    color: #f7f8f8; line-height: 1.08;
  }
  .tagline {
    margin-top: 22px; font-size: 30px; font-weight: 500; color: #8a8f98;
  }
  .rule { margin-top: 44px; height: 1px; background: #23252a; }
  .foot {
    margin-top: 26px; display: flex; align-items: center; gap: 14px;
    font-size: 21px; color: #62666d;
  }
  .dot { width: 9px; height: 9px; border-radius: 999px; background: #5e6ad2; }
</style>
</head>
<body>
  <div class="card">
    <div class="glow"></div>
    <div class="inner">
      <div class="eyebrow">{{NAME}}</div>
      <h1>{{ROLE}}</h1>
      <div class="tagline">{{TAGLINE}}</div>
      <div class="rule"></div>
      <div class="foot"><span class="dot"></span>{{URL}}</div>
    </div>
  </div>
</body>
</html>
